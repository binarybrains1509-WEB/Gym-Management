<!DOCTYPE html>
<html>
<head>
  <title>User Login</title>
  <style>
    body{
      background:#000;color:#fff;
      display:flex;justify-content:center;align-items:center;
      height:100vh;font-family:system-ui;
    }
    .box{
      background:#111;padding:30px;width:350px;
      border-radius:1rem;
      box-shadow:0 0 20px rgba(69,255,196,.3);
      text-align:center;
    }
    input,button{
      width:100%;
      padding:12px;
      margin:10px 0;
      border-radius:1rem;
      border:1px solid #333;
      background:#222;
      color:#fff;
    }
    button{
      background:#45ffc4;
      color:#000;
      font-weight:600;
      cursor:pointer;
    }
    .signup-link{
      margin-top:15px;
      font-size:14px;
    }
    .signup-link a{
      color:#45ffc4;
      text-decoration:none;
      font-weight:500;
    }
    .signup-link a:hover{
      text-decoration:underline;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>User Login</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>

  <!--  SIGNUP LINK -->
  <div class="signup-link">
    New user? <a href="signup.html">Create an account</a>
  </div>
</div>

<script>
async function login(){
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if(!username || !password){
    alert("Enter username and password");
    return;
  }

  try{
    const res = await fetch("http://localhost:5000/api/auth/login",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ username, password })
    });

    const result = await res.json();

    if(!res.ok){
      alert(result.message || "Login failed ");
      return;
    }

    localStorage.setItem("userId", result.userId);

    localStorage.removeItem("selectedPlanId");
    localStorage.removeItem("selectedPlanName");
    localStorage.removeItem("selectedPrice");

    if(result.activePlan && result.activePlan.plan){
      localStorage.setItem("activePlanId", result.activePlan.plan._id);
    }else{
      localStorage.removeItem("activePlanId");
    }

    window.location.href = "home.html";

  }catch(err){
    console.error(err);
    alert("Server error ");
  }
}
</script>

</body>
</html>
