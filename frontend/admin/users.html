<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Users | Xsport Fitness</title>
  
</head>
<style>
    body {
  margin: 0;
  padding: 30px;
  font-family: system-ui, sans-serif;
  background: #0b0b0b;
  color: #fff;
}

h2 {
  color: #45ffc4;
  margin-bottom: 20px;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: #111;
  border-radius: 8px;
  overflow: hidden;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #333;
  text-align: left;
}

th {
  background: #000;
  color: #45ffc4;
}

tr:hover {
  background: #1a1a1a;
}

/* ===== BUTTONS ===== */
button {
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
}

.btn-delete {
  background: #ff4d4d;
  color: #fff;
}

.btn-update {
  background: #45ffc4;
  color: #000;
  margin-right: 6px;
}

button:hover {
  opacity: 0.85;
}

/* ===== MODAL ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #111;
  padding: 20px;
  width: 320px;
  border-radius: 10px;
}

.modal-content h3 {
  color: #45ffc4;
  margin-bottom: 15px;
}

.modal-content input,
.modal-content select {
  width: 100%;
  padding: 8px;
  margin-bottom: 12px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 6px;
}
.top-actions {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 10px;
}

.back-btn {
  background: transparent;
  border: 1px solid #45ffc4;
  padding: 7px 16px;
  color: #45ffc4;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
}

.back-btn:hover {
  background: #45ffc4;
  color: #000;
}

</style>
<body>
<div class="top-actions">
  <button class="back-btn" onclick="goBack()">← Back</button>
</div>

<h2>👤 Users Management</h2>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Plan</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="users">
    <tr><td colspan="5">Loading users...</td></tr>
  </tbody>
</table>

<!-- ================= UPDATE USER MODAL ================= -->
<div class="modal" id="updateModal">
  <div class="modal-content">
    <h3>Update User</h3>

    <input id="u_name" placeholder="Name">
    <input id="u_email" placeholder="Email">

    <select id="u_role">
      <option value="user">User</option>
      <option value="trainer">Trainer</option>
      <option value="admin">Admin</option>
    </select>

    <!-- PLAN DROPDOWN -->
    <select id="u_plan">
      <option value="">No Plan</option>
    </select>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn-update" onclick="updateUser()">Update</button>
      <button class="btn-delete" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const API_BASE = "http://localhost:5000";
let selectedUserId = null;

/* ================= LOAD PLANS ================= */
async function loadPlans() {
  const res = await fetch(`${API_BASE}/admin/plans`);
  const plans = await res.json();

  const planSelect = document.getElementById("u_plan");
  planSelect.innerHTML = `<option value="">No Plan</option>`;

  plans.forEach(p => {
    planSelect.innerHTML += `
      <option value="${p._id}">${p.name}</option>
    `;
  });
}

/* ================= LOAD USERS ================= */
async function loadUsers() {
  const tbody = document.getElementById("users");

  try {
    const res = await fetch(`${API_BASE}/admin/users`);
    if (!res.ok) throw new Error("API error");

    const users = await res.json();
    tbody.innerHTML = "";

    if (users.length === 0) {
      tbody.innerHTML = "<tr><td colspan='5'>No users found</td></tr>";
      return;
    }

    users.forEach(u => {
      tbody.innerHTML += `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${u.activePlan ? u.activePlan.name : "No Plan"}</td>
          <td>
            <button class="btn-update"
              onclick="openModal(
                '${u._id}',
                '${u.name}',
                '${u.email}',
                '${u.role}',
                '${u.activePlan ? u.activePlan._id : ""}'
              )">
              Update
            </button>
            <button class="btn-delete"
              onclick="deleteUser('${u._id}')">
              Delete
            </button>
          </td>
        </tr>
      `;
    });

  } catch (err) {
    console.error(err);
    alert(" Backend server Is Not  Runningर");
  }
}

/* ================= DELETE USER ================= */
async function deleteUser(id) {
  if (!confirm("Are you sure you want to delete this user?")) return;

  await fetch(`${API_BASE}/admin/users/${id}`, {
    method: "DELETE"
  });

  loadUsers();
}

/* ================= OPEN MODAL ================= */
function openModal(id, name, email, role, activePlanId) {
  selectedUserId = id;

  u_name.value = name;
  u_email.value = email;
  u_role.value = role;
  u_plan.value = activePlanId || "";

  updateModal.style.display = "flex";
}

/* ================= CLOSE MODAL ================= */
function closeModal() {
  updateModal.style.display = "none";
}

/* ================= UPDATE USER ================= */
async function updateUser() {
  await fetch(`${API_BASE}/admin/users/${selectedUserId}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      name: u_name.value,
      email: u_email.value,
      role: u_role.value,
      activePlan: u_plan.value
    })
  });

  closeModal();
  loadUsers();
}

/* ================= INIT ================= */
loadPlans();
loadUsers();

function goBack() {
  window.location.href = "index.html"; //  admin dashboard / home
}

</script>

</body>
</html>
